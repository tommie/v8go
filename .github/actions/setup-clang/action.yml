name: Set Up Clang
description: |
  Installs the Clang version required by the libc++ headers in
  deps/include_libcxx/, and sets CC and CXX.

  Chromium's libc++ follows LLVM trunk, so the minimum version increases
  with V8 upgrades. See _LIBCPP_CLANG_VER in
  deps/include_libcxx/__configuration/compiler.h.

inputs:
  version:
    description: The LLVM major version.
    default: '21'
  extra-packages:
    description: Additional Debian packages, with {version} substituted.
    default: ''

runs:
  using: composite
  steps:
  - name: Install Clang (Linux)
    if: runner.os == 'Linux'
    shell: bash
    run: |
      curl -fsSL https://apt.llvm.org/llvm.sh -o "$RUNNER_TEMP/llvm.sh"
      sudo bash "$RUNNER_TEMP/llvm.sh" ${{ inputs.version }}
      extra="${{ inputs.extra-packages }}"
      [ -z "$extra" ] || sudo apt-get install -yq ${extra//\{version\}/${{ inputs.version }}}
      echo "CC=clang-${{ inputs.version }}" >>"$GITHUB_ENV"
      echo "CXX=clang++-${{ inputs.version }}" >>"$GITHUB_ENV"

  - name: Install Clang (macOS)
    if: runner.os == 'macOS'
    shell: bash
    run: |
      brew install llvm@${{ inputs.version }}
      prefix="$(brew --prefix llvm@${{ inputs.version }})"
      echo "CC=$prefix/bin/clang" >>"$GITHUB_ENV"
      echo "CXX=$prefix/bin/clang++" >>"$GITHUB_ENV"
