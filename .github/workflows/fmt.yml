name: Code Format

on:
  push:
    branches:
    - master
  pull_request:
  workflow_dispatch:

jobs:
  fmt:
    name: Check Code Format and Style
    runs-on: ubuntu-latest
    steps:
    - name: Checkout
      uses: actions/checkout@v7
      with:
        fetch-depth: 1

    - name: Set Up Clang
      uses: ./.github/actions/setup-clang
      with:
        extra-packages: clang-format-{version}

    - name: go fmt
      run: go fmt

    - name: go vet
      run: go vet
      env:
        CGO_CXXFLAGS: "-nostdinc++"

    # Fails rather than falling back to the runner's clang-format, whose
    # version can change with the runner image.
    - name: go generate (clang-format)
      run: |
        test -n "$CLANG_FORMAT"
        "$CLANG_FORMAT" --version
        go generate

    - name: Display missing format changes
      run: git diff --exit-code
